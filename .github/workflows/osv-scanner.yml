name: OSV Dependency Security

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

# Default to read-only access. SARIF upload permission is scoped to each scan job.
permissions:
  contents: read

concurrency:
  group: osv-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-pr:
    if: github.event_name == 'pull_request'
    # google/osv-scanner-action v2.7.0, dereferenced annotated tag
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      runs-on: ubuntu-24.04
      fail-on-vuln: true
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --lockfile=requirements.txt:.github/requirements/pre-commit.txt

  osv-full:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    # google/osv-scanner-action v2.7.0
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      runs-on: ubuntu-24.04
      fail-on-vuln: true
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --lockfile=requirements.txt:.github/requirements/pre-commit.txt
