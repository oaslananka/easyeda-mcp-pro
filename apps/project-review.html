<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyEDA Read-Only Review</title>
    <style>
      :root {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color-scheme: light dark;
        --accent-color: #3157c8;
        --accent-hover: #436be0;
        --border-color: rgba(127, 127, 127, 0.35);
        --bg-subtle: rgba(127, 127, 127, 0.08);
        --bg-active: rgba(49, 87, 200, 0.15);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --accent-color: #92b0ff;
          --accent-hover: #a9c2ff;
          --border-color: rgba(255, 255, 255, 0.22);
          --bg-subtle: rgba(255, 255, 255, 0.06);
          --bg-active: rgba(146, 176, 255, 0.2);
        }
      }
      body {
        padding: 20px;
        margin: 0;
        background: transparent;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0;
      }
      small,
      .muted {
        opacity: 0.82;
        font-size: 0.9rem;
      }
      .project-status {
        margin: 14px 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        font-size: 0.92rem;
      }
      .status-pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 9999px;
        font-size: 0.78rem;
        background: var(--bg-subtle);
        border: 1px solid var(--border-color);
      }
      .status-pill.active {
        background: var(--bg-active);
        border-color: var(--accent-color);
        color: var(--accent-color);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        padding: 8px 14px;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background: var(--bg-subtle);
        color: inherit;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 500;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          transform 100ms ease;
      }
      button:hover:not(:disabled) {
        background: var(--bg-active);
        border-color: var(--accent-color);
      }
      button:active:not(:disabled) {
        transform: scale(0.98);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }
      button.active {
        background: var(--accent-color);
        color: #ffffff;
        border-color: var(--accent-color);
      }
      @media (prefers-color-scheme: dark) {
        button.active {
          color: #0f172a;
          font-weight: 600;
        }
      }
      section {
        margin-top: 18px;
      }
      .report-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .copy-btn {
        padding: 4px 10px;
        font-size: 0.8rem;
        font-weight: 500;
      }
      pre {
        max-height: 420px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 14px;
        margin: 0;
        background: var(--bg-subtle);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.85rem;
        line-height: 1.45;
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>EasyEDA — read-only project review</h1>
    <p class="muted">
      All data is requested from the existing MCP tools and stays subject to their normal scope,
      project ID and Remote Relay gates. No CAD writes are available from this view.
    </p>
    <p id="project" class="project-status">
      Project: <span id="project-pill" class="status-pill">waiting for MCP host</span>
    </p>
    <nav role="tablist" aria-label="Review reports">
      <button id="bom" role="tab" aria-selected="false" disabled>BOM</button>
      <button id="pcb" role="tab" aria-selected="false" disabled>PCB components</button>
      <button id="erc" role="tab" aria-selected="false" disabled>ERC</button>
    </nav>
    <section>
      <div class="report-header">
        <h2 id="result-title">Report</h2>
        <button
          id="copy-btn"
          class="copy-btn"
          style="display: none"
          title="Copy report JSON to clipboard"
        >
          Copy JSON
        </button>
      </div>
      <pre id="report" aria-live="polite">Waiting for host</pre>
    </section>
    <!-- BUNDLED_APP -->
  </body>
</html>
