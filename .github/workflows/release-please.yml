---
name: Release Please PR

on:
  push:
    branches: [main]

concurrency:
  group: release-please-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-please:
    name: Maintain stable release PR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Defer stable PR management on the release commit
        id: manager_gate
        run: |
          set -euo pipefail
          ENABLED=true
          if [[ "$(git log -1 --format=%s)" =~ ^chore\(main\):\ release\ easyeda-mcp-pro\ [0-9]+\.[0-9]+\.[0-9]+ ]]; then
            ENABLED=false
          fi
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "Stable Release Please manager enabled: $ENABLED"

      - name: Resolve stable Release Please eligibility
        if: ${{ steps.manager_gate.outputs.enabled == 'true' }}
        id: release_eligibility
        run: node scripts/release-please-eligibility.mjs

      - name: Reconcile verified published release PR labels
        if: ${{ steps.release_eligibility.outputs.run_release_please == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          git fetch --tags --force origin
          node scripts/reconcile-release-please.mjs

      - name: Run Release Please PR manager
        if: ${{ steps.release_eligibility.outputs.run_release_please == 'true' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
