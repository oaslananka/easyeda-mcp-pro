---
name: Golden Benchmark

'on':
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # pnpm/setup v3.0.0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: '11.28.0'
          install: false
          node-version-file: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm

      - name: Verify runtime pin parity
        run: node scripts/check-runtime-pins.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime policy
        run: pnpm runtime:check
      - name: Run golden eval benchmark (non-live, mocked-fixture tier)
        run: pnpm exec tsx scripts/run-evals.mts --output .easyeda-mcp-pro/evals/ci-latest.json

      - name: Upload benchmark report
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: golden-benchmark-report
          path: .easyeda-mcp-pro/evals/ci-latest.json
          retention-days: 30
