---
packages:
  - easyeda-bridge-extension

allowBuilds:
  esbuild: true
minimumReleaseAge: 10080
# Exact-version release-age exceptions for reviewed security overrides.
minimumReleaseAgeExclude:
  - undici@8.9.0
  - undici@6.28.0
  - fast-uri@3.1.5
  - ip-address@10.3.1
  - hono@4.12.34
  - postcss@8.5.23
  - brace-expansion@5.0.9
  - qs@6.16.0
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true

overrides:
  fast-uri: 3.1.5
  hono: 4.12.34
  '@hono/node-server': 2.0.10
  body-parser: 2.3.0
  vite: 7.3.5
  '@vitejs/plugin-vue': 6.0.7
  esbuild: 0.28.1
  postcss: 8.5.23
  nanoid: 3.3.18
  brace-expansion: 5.0.9
  qs: 6.16.0
  ip-address: 10.3.1
  'undici@6.27.0': 6.28.0
