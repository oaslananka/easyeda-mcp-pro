name: CI
'on':
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  static_quality:
    name: static-quality
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.28.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify runtime pin parity
        run: node scripts/check-runtime-pins.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime policy
        run: pnpm runtime:check
      - name: Verify release compatibility evidence
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release-please--') || startsWith(github.head_ref, 'release/')) }}
        run: pnpm release:readiness:compatibility
      - name: Run dependency audit
        id: dependency_audit
        timeout-minutes: 11
        run: pnpm security:audit
      - run: pnpm peers check
      - name: Verify deterministic repository quality
        run: pnpm verify:fast
      - name: Run golden eval benchmark (non-live, mocked-fixture tier)
        run: pnpm eval:golden
  tests:
    name: tests-and-coverage
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.28.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify runtime pin parity
        run: node scripts/check-runtime-pins.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime policy
        run: pnpm runtime:check
      - name: Run server tests with coverage and JUnit output
        id: server_coverage
        run: pnpm test:coverage:ci
      - name: Validate server CI reports
        id: server_reports
        if: ${{ !cancelled() && steps.server_coverage.outcome == 'success' }}
        run: node scripts/validate-ci-reports.mjs --coverage coverage/lcov.info --junit reports/server.junit.xml
      - name: Run extension tests with coverage and JUnit output
        id: extension_coverage
        if: ${{ !cancelled() && steps.server_coverage.outcome != 'skipped' }}
        run: pnpm test:extension:ci
      - name: Validate extension CI reports
        id: extension_reports
        if: ${{ !cancelled() && steps.extension_coverage.outcome == 'success' }}
        run: node scripts/validate-ci-reports.mjs --coverage easyeda-bridge-extension/coverage/lcov.info --junit reports/extension.junit.xml
      - name: Stage coverage telemetry reports
        id: coverage_artifact
        if: ${{ !cancelled() && steps.server_reports.outcome == 'success' && steps.extension_reports.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-reports-${{ github.run_id }}
          path: |
            coverage/lcov.info
            easyeda-bridge-extension/coverage/lcov.info
            reports/server.junit.xml
            reports/extension.junit.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 3
  extension_integrity:
    name: extension-integrity
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.28.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify runtime pin parity
        run: node scripts/check-runtime-pins.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime policy
        run: pnpm runtime:check
      - run: pnpm package:prepare
      - name: Scan source and generated outputs for secret-like material
        run: pnpm security:secrets
      - run: pnpm check:extension-size
      - run: pnpm verify:extension
      - name: Pack PR test package
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
      - name: Upload PR test artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: easyeda-mcp-pro-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/*.tgz
            easyeda-bridge-extension.eext
            easyeda-bridge-extension.checksums.json
            easyeda-bridge-extension/dist/index.js
          if-no-files-found: error
          retention-days: 14
        continue-on-error: true
  package_docs:
    name: package-docs-docker
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.28.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify runtime pin parity
        run: node scripts/check-runtime-pins.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime policy
        run: pnpm runtime:check
      - run: pnpm generate:tools-doc
      - run: git diff --exit-code docs/reference/tools.md
      - run: pnpm docs:build
      - name: Build Docker image
        run: docker build -t easyeda-mcp-pro:ci .
      - name: Verify Docker loopback, fail-closed, and published-port networking
        run: node scripts/e2e/docker-network-smoke.mjs --image easyeda-mcp-pro:ci
  coverage_telemetry:
    name: coverage-telemetry
    needs: tests
    if: ${{ !cancelled() && needs.tests.result == 'success' }}
    continue-on-error: true
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.28.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate Codecov configuration
        run: pnpm validate:codecov
        id: codecov_config
        continue-on-error: true
      - name: Download coverage telemetry reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: quality-reports-${{ github.run_id }}
          path: .
      - name: Install SHA-256 verified Codecov CLI
        id: codecov_cli
        if: ${{ !cancelled() && steps.reports.outcome == 'success' }}
        run: node scripts/install-codecov-cli.mjs --output "${RUNNER_TEMP}/codecov-cli/codecovcli"
        continue-on-error: true
      - name: Upload server coverage to Codecov (trusted)
        continue-on-error: true
        id: server_coverage_upload_trusted
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && steps.codecov_cli.outcome == 'success' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          binary: ${{ runner.temp }}/codecov-cli/codecovcli
          files: coverage/lcov.info
          flags: server
          name: server-coverage
          report_type: coverage
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
      - name: Upload server coverage to Codecov (tokenless fork)
        continue-on-error: true
        id: server_coverage_upload_tokenless
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && steps.codecov_cli.outcome == 'success' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          binary: ${{ runner.temp }}/codecov-cli/codecovcli
          files: coverage/lcov.info
          flags: server
          name: server-coverage-tokenless
          report_type: coverage
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
      - name: Upload extension coverage to Codecov (trusted)
        continue-on-error: true
        id: extension_coverage_upload_trusted
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && steps.codecov_cli.outcome == 'success' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          binary: ${{ runner.temp }}/codecov-cli/codecovcli
          files: easyeda-bridge-extension/coverage/lcov.info
          flags: extension
          name: extension-coverage
          report_type: coverage
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
      - name: Upload extension coverage to Codecov (tokenless fork)
        continue-on-error: true
        id: extension_coverage_upload_tokenless
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && steps.codecov_cli.outcome == 'success' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          binary: ${{ runner.temp }}/codecov-cli/codecovcli
          files: easyeda-bridge-extension/coverage/lcov.info
          flags: extension
          name: extension-coverage-tokenless
          report_type: coverage
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
      - name: Upload server test results to Codecov
        continue-on-error: true
        id: server_test_results_upload
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && steps.codecov_cli.outcome == 'success' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          binary: ${{ runner.temp }}/codecov-cli/codecovcli
          files: reports/server.junit.xml
          flags: server-tests
          name: server-test-results
          report_type: test_results
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
      - name: Upload extension test results to Codecov
        continue-on-error: true
        id: extension_test_results_upload
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && steps.codecov_cli.outcome == 'success' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          binary: ${{ runner.temp }}/codecov-cli/codecovcli
          files: reports/extension.junit.xml
          flags: extension-tests
          name: extension-test-results
          report_type: test_results
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
      - name: Summarize coverage telemetry
        if: ${{ always() }}
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          CODECOV_CONFIG_OUTCOME: ${{ steps.codecov_config.outcome }}
          REPORT_DOWNLOAD_OUTCOME: ${{ steps.reports.outcome }}
          CODECOV_CLI_OUTCOME: ${{ steps.codecov_cli.outcome }}
          SERVER_COVERAGE_UPLOAD_TRUSTED_OUTCOME: ${{ steps.server_coverage_upload_trusted.outcome }}
          SERVER_COVERAGE_UPLOAD_TOKENLESS_OUTCOME: ${{ steps.server_coverage_upload_tokenless.outcome }}
          EXTENSION_COVERAGE_UPLOAD_TRUSTED_OUTCOME: ${{ steps.extension_coverage_upload_trusted.outcome }}
          EXTENSION_COVERAGE_UPLOAD_TOKENLESS_OUTCOME: ${{ steps.extension_coverage_upload_tokenless.outcome }}
          SERVER_TEST_RESULTS_UPLOAD_OUTCOME: ${{ steps.server_test_results_upload.outcome }}
          EXTENSION_TEST_RESULTS_UPLOAD_OUTCOME: ${{ steps.extension_test_results_upload.outcome }}
        run: |
          {
            echo '### Coverage telemetry'
            echo
            echo 'This job is diagnostic and is not part of the required quality aggregator.'
            echo
            echo '| Stage | Outcome |'
            echo '| --- | --- |'
            echo "| required tests job | ${TESTS_RESULT:-unknown} |"
            echo "| Codecov configuration validator | ${CODECOV_CONFIG_OUTCOME:-skipped} |"
            echo "| report artifact download | ${REPORT_DOWNLOAD_OUTCOME:-skipped} |"
            echo "| Codecov CLI | ${CODECOV_CLI_OUTCOME:-skipped} |"
            echo "| server Codecov coverage upload (trusted) | ${SERVER_COVERAGE_UPLOAD_TRUSTED_OUTCOME:-skipped} |"
            echo "| server Codecov coverage upload (tokenless) | ${SERVER_COVERAGE_UPLOAD_TOKENLESS_OUTCOME:-skipped} |"
            echo "| extension Codecov coverage upload (trusted) | ${EXTENSION_COVERAGE_UPLOAD_TRUSTED_OUTCOME:-skipped} |"
            echo "| extension Codecov coverage upload (tokenless) | ${EXTENSION_COVERAGE_UPLOAD_TOKENLESS_OUTCOME:-skipped} |"
            echo "| server Codecov test-results upload | ${SERVER_TEST_RESULTS_UPLOAD_OUTCOME:-skipped} |"
            echo "| extension Codecov test-results upload | ${EXTENSION_TEST_RESULTS_UPLOAD_OUTCOME:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"
  test-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node-version: 24.21.0
          - os: windows-2025
            node-version: 24.21.0
          - os: macos-26
            node-version: 24.21.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.28.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Verify runtime pin parity
        run: node scripts/check-runtime-pins.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime policy
        run: pnpm runtime:check
      - run: pnpm typecheck
      - run: pnpm typecheck:extension
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:extension
      - name: Packed artifact install and doctor
        run: node scripts/e2e/packed-install-doctor.mjs
  quality:
    name: quality (24)
    if: ${{ always() }}
    needs:
      - static_quality
      - tests
      - extension_integrity
      - package_docs
      - test-matrix
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize deterministic quality gates
        env:
          STATIC_QUALITY_RESULT: ${{ needs.static_quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          EXTENSION_INTEGRITY_RESULT: ${{ needs.extension_integrity.result }}
          PACKAGE_DOCS_RESULT: ${{ needs.package_docs.result }}
          TEST_MATRIX_RESULT: ${{ needs['test-matrix'].result }}
        run: |
          {
            echo '### Required quality aggregator'
            echo
            echo '| Deterministic gate | Result |'
            echo '| --- | --- |'
            echo "| static-quality | $STATIC_QUALITY_RESULT |"
            echo "| tests-and-coverage | $TESTS_RESULT |"
            echo "| extension-integrity | $EXTENSION_INTEGRITY_RESULT |"
            echo "| package-docs-docker | $PACKAGE_DOCS_RESULT |"
            echo "| test-matrix | $TEST_MATRIX_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in "$STATIC_QUALITY_RESULT" "$TESTS_RESULT" "$EXTENSION_INTEGRITY_RESULT" "$PACKAGE_DOCS_RESULT" "$TEST_MATRIX_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo 'One or more required deterministic quality jobs failed or were skipped.' >&2
            exit 1
          fi
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.28.0
          install: false
          node-version-file: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify runtime pin parity
        run: node scripts/check-runtime-pins.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime policy
        run: pnpm runtime:check
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e