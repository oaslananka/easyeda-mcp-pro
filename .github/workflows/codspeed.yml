---
name: CodSpeed

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmarks:
    name: Run benchmarks
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # pnpm/setup v3.0.0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11.28.8
          install: false
          node-version-file: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Verify runtime pin parity
        run: node scripts/check-runtime-pins.mjs
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runtime policy
        run: pnpm runtime:check
      - name: Run benchmarks
        # CodSpeedHQ/action v5.5.0
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da
        with:
          mode: simulation
          run: pnpm bench
